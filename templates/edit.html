{% extends "base.html" %}
{% block title %}{{ t('edit_title') }}{% endblock %}
{% block content %}

<section class="form-wrap">
  <h1>{{ t('edit_title') }}</h1>
  <p class="form-sub">{{ t('edit_sub') }}</p>

  <form method="post" enctype="multipart/form-data" class="item-form">
    <label class="field">
      <span>{{ t('field_id') }}</span>
      <input type="text" value="{{ item.id }}" disabled>
    </label>

    <label class="field">
      <span>{{ t('field_name') }} <em>{{ t('field_optional') }}</em></span>
      <input type="text" name="name" value="{{ item.name or '' }}" placeholder="e.g. Navy denim jacket">
    </label>

    <label class="field">
      <span>{{ t('field_category') }} <em>{{ t('field_optional') }}</em></span>
      <input type="text" name="category" value="{{ item.category or '' }}" placeholder="e.g. Jackets">
    </label>

    <div class="field-grid">
      <label class="field">
        <span>{{ t('colors_label') }} <em>{{ t('field_optional') }}</em></span>
        <input type="text" name="colors" value="{{ item.colors or '' }}" placeholder="{{ t('colors_placeholder') }}">
      </label>
      <label class="field">
        <span>{{ t('sizes_label') }} <em>{{ t('field_optional') }}</em></span>
        <input type="text" name="sizes" value="{{ item.sizes or '' }}" placeholder="{{ t('sizes_placeholder') }}">
      </label>
    </div>

    <h2 class="form-section-heading">{{ t('inventory_section_title') }}</h2>
    <div class="field-grid">
      <label class="field">
        <span>{{ t('purchase_price_label') }}</span>
        <input type="number" name="purchase_price" value="{{ item.purchase_price if item.purchase_price is not none else '' }}" step="0.001" min="0" inputmode="decimal">
      </label>
      <label class="field">
        <span>{{ t('sale_price_label') }}</span>
        <input type="number" name="sale_price" value="{{ item.sale_price if item.sale_price is not none else '' }}" step="0.001" min="0" inputmode="decimal">
      </label>
      <label class="field">
        <span>{{ t('cost_label') }}</span>
        <input type="number" name="cost" value="{{ item.cost if item.cost is not none else '' }}" step="0.001" min="0" inputmode="decimal">
      </label>
      <label class="field">
        <span>{{ t('purchase_qty_label') }}</span>
        <input type="number" name="purchase_qty" value="{{ item.purchase_qty if item.purchase_qty is not none else '' }}" step="1" min="0" inputmode="numeric">
      </label>
      <label class="field">
        <span>{{ t('sale_qty_label') }}</span>
        <input type="number" name="sale_qty" value="{{ item.sale_qty if item.sale_qty is not none else '' }}" step="1" min="0" inputmode="numeric">
      </label>
      <label class="field">
        <span>{{ t('stock_label') }}</span>
        <input type="number" name="stock" value="{{ item.stock if item.stock is not none else '' }}" step="1" min="0" inputmode="numeric">
      </label>
    </div>

    <div class="field">
      <span>{{ t('edit_photos_current') }}</span>
      <div class="current-photos">
        {% for img in images %}
        <label class="photo-remove-item">
          <img src="{{ r2_url(img.thumb_key) }}" alt="">
          <span class="photo-remove-check">
            <input type="checkbox" name="remove" value="{{ img.id }}">
            {{ t('remove_photo') }}
          </span>
        </label>
        {% endfor %}
      </div>
    </div>

    <label class="field file-field">
      <span>{{ t('edit_photos_add') }} <em>{{ t('field_optional') }}</em></span>
      <input type="file" name="images" accept="image/png, image/jpeg, image/webp" multiple id="fileInput">
      <div class="preview-grid" id="previewBox">{{ t('no_photos_selected') }}</div>
    </label>

    <button type="submit" class="submit-btn">{{ t('submit_edit') }}</button>
  </form>
</section>

<script>
  const fileInput = document.getElementById('fileInput');
  const previewBox = document.getElementById('previewBox');
  const emptyLabel = '{{ t("no_photos_selected") }}';
  fileInput.addEventListener('change', () => {
    const files = Array.from(fileInput.files || []);
    previewBox.innerHTML = '';
    if (!files.length) { previewBox.textContent = emptyLabel; return; }
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.createElement('img');
        img.src = e.target.result;
        img.className = 'preview-thumb';
        previewBox.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  });
</script>

{% endblock %}
