{% extends "base.html" %}
{% block title %}{{ t('nav_add_item') }}{% endblock %}
{% block content %}

<section class="form-wrap">
  <h1>{{ t('upload_title') }}</h1>
  <p class="form-sub">{{ t('upload_sub') }}</p>

  <form method="post" enctype="multipart/form-data" class="item-form">
    <label class="field">
      <span>{{ t('field_id') }} <em>{{ t('field_id_hint') }}</em></span>
      <input type="text" name="item_id" required placeholder="e.g. 4521" autofocus>
    </label>

    <label class="field">
      <span>{{ t('field_name') }} <em>{{ t('field_optional') }}</em></span>
      <input type="text" name="name" placeholder="e.g. Navy denim jacket">
    </label>

    <label class="field">
      <span>{{ t('field_category') }} <em>{{ t('field_optional') }}</em></span>
      <input type="text" name="category" placeholder="e.g. Jackets">
    </label>

    <h2 class="form-section-heading">{{ t('inventory_section_title') }}</h2>
    <div class="field-grid">
      <label class="field">
        <span>{{ t('purchase_price_label') }}</span>
        <input type="number" name="purchase_price" step="0.001" min="0" inputmode="decimal">
      </label>
      <label class="field">
        <span>{{ t('sale_price_label') }}</span>
        <input type="number" name="sale_price" step="0.001" min="0" inputmode="decimal">
      </label>
      <label class="field">
        <span>{{ t('cost_label') }}</span>
        <input type="number" name="cost" step="0.001" min="0" inputmode="decimal">
      </label>
      <label class="field">
        <span>{{ t('purchase_qty_label') }}</span>
        <input type="number" name="purchase_qty" step="1" min="0" inputmode="numeric">
      </label>
      <label class="field">
        <span>{{ t('sale_qty_label') }}</span>
        <input type="number" name="sale_qty" step="1" min="0" inputmode="numeric">
      </label>
      <label class="field">
        <span>{{ t('stock_label') }}</span>
        <input type="number" name="stock" step="1" min="0" inputmode="numeric">
      </label>
    </div>

    <label class="field file-field">
      <span>{{ t('field_photos') }} <em>{{ t('field_photos_hint') }}</em></span>
      <input type="file" name="images" accept="image/png, image/jpeg, image/webp" multiple required id="fileInput">
      <div class="preview-grid" id="previewBox">{{ t('no_photos_selected') }}</div>
    </label>

    <button type="submit" class="submit-btn">{{ t('submit_add') }}</button>
  </form>
</section>

<script>
  const fileInput = document.getElementById('fileInput');
  const previewBox = document.getElementById('previewBox');
  const emptyLabel = '{{ t("no_photos_selected") }}';
  fileInput.addEventListener('change', () => {
    const files = Array.from(fileInput.files || []);
    previewBox.innerHTML = '';
    if (!files.length) { previewBox.textContent = emptyLabel; return; }
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.createElement('img');
        img.src = e.target.result;
        img.className = 'preview-thumb';
        previewBox.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  });
</script>

{% endblock %}
