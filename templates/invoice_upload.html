{% extends "base.html" %}
{% block title %}{{ t('invoice_title') }}{% endblock %}
{% block content %}

<section class="form-wrap">
  <h1>{{ t('invoice_title') }}</h1>
  <p class="form-sub">{{ t('invoice_sub') }}</p>

  <form method="post" enctype="multipart/form-data" class="item-form">
    <label class="field file-field">
      <span>{{ t('invoice_field') }}</span>
      <input type="file" name="file" accept=".pdf,application/pdf" required>
    </label>
    <button type="submit" class="submit-btn">{{ t('invoice_btn') }}</button>
  </form>
</section>

{% endblock %}
